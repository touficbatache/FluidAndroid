plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-android-extensions'
    id 'kotlin-kapt'
}

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.batache.fluidandroid"
        minSdkVersion 21
        targetSdkVersion 30
        renderscriptTargetApi 30
        renderscriptSupportModeEnabled true
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    kapt {
        correctErrorTypes = true
    }

    // Local-only assets (gitignored): the original screenshots, album covers and lyrics used
    // while developing. Debug builds overlay them on the public placeholders when present.
    sourceSets {
        debug {
            res.srcDirs += 'src/private/res'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.1'
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
//    implementation 'androidx.appcompat:appcompat:1.3.0'
//    implementation 'com.google.android.material:material:1.4.0-rc01'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'

//    implementation 'com.github.lcdsmao:springx:0.0.2'

//    implementation 'app.juky:squircleview:0.0.3'

    implementation 'jp.wasabeef:blurry:4.0.0'
    implementation 'io.alterac.blurkit:blurkit:1.1.0'

    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation-ktx:1.0.0-alpha03'

    implementation 'com.jjoe64:graphview:4.2.2'

    implementation 'io.github.florent37:shapeofview:1.4.7'

    implementation 'com.airbnb.android:epoxy:5.0.0-beta02'
    kapt 'com.airbnb.android:epoxy-processor:5.0.0-beta02'

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    implementation project(":libs:springx")
}